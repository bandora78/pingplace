name: Android signed test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-test-apk:
    name: Build and upload signed test APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # .metadata pins the project to the Flutter 3.47.7 stable revision.
          flutter-version: 3.47.7
          cache: true

      - name: Read trusted build identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "${version_line}" ]]; then
            echo "Could not read the app version from pubspec.yaml" >&2
            exit 1
          fi

          build_name="${version_line%%+*}"
          commit_short="$(git rev-parse --short=7 HEAD)"
          # Keep signed test APK versionCodes increasing within this workflow's
          # run-number sequence so a later APK can update an earlier one.
          build_number="$((10000 + GITHUB_RUN_NUMBER))"

          echo "version=${version_line}" >> "${GITHUB_OUTPUT}"
          echo "build_name=${build_name}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "commit_short=${commit_short}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate signing secrets
        env:
          PINGPLACE_KEYSTORE_BASE64: ${{ secrets.PINGPLACE_KEYSTORE_BASE64 }}
          PINGPLACE_DEBUG_STORE_PASSWORD: ${{ secrets.PINGPLACE_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_KEY_ALIAS }}
          PINGPLACE_DEBUG_KEY_PASSWORD: ${{ secrets.PINGPLACE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PINGPLACE_KEYSTORE_BASE64 \
            PINGPLACE_KEYSTORE_PASSWORD \
            PINGPLACE_KEY_ALIAS \
            PINGPLACE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure the dedicated test-signing secrets documented in README.md."
            exit 1
          fi

      - name: Reconstruct dedicated test keystore
        env:
          PINGPLACE_KEYSTORE_BASE64: ${{ secrets.PINGPLACE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/pingplace-signing"
          mkdir -p "${signing_dir}"
          printf '%s' "${PINGPLACE_KEYSTORE_BASE64}" | base64 --decode > "${signing_dir}/pingplace-debug.keystore"
          chmod 600 "${signing_dir}/pingplace-debug.keystore"
          test -s "${signing_dir}/pingplace-debug.keystore"

      - name: Validate reconstructed signing configuration
        env:
          PINGPLACE_DEBUG_KEYSTORE_FILE: ${RUNNER_TEMP}/pingplace-signing/pingplace-debug.keystore
          PINGPLACE_DEBUG_STORE_PASSWORD: ${{ secrets.PINGPLACE_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_KEY_ALIAS }}
          PINGPLACE_DEBUG_KEY_PASSWORD: ${{ secrets.PINGPLACE_KEY_PASSWORD }}
          PINGPLACE_REQUIRE_CI_DEBUG_SIGNING: 'true'
        shell: bash
        run: bash .github/scripts/validate-signing-environment.sh

      - name: Build consistently signed test APK
        env:
          PINGPLACE_DEBUG_KEYSTORE_FILE: ${RUNNER_TEMP}/pingplace-signing/pingplace-debug.keystore
          PINGPLACE_DEBUG_STORE_PASSWORD: ${{ secrets.PINGPLACE_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_KEY_ALIAS }}
          PINGPLACE_DEBUG_KEY_PASSWORD: ${{ secrets.PINGPLACE_KEY_PASSWORD }}
          PINGPLACE_REQUIRE_CI_DEBUG_SIGNING: 'true'
        run: >-
          flutter build apk --debug
          --build-name "${{ steps.version.outputs.build_name }}"
          --build-number "${{ steps.version.outputs.build_number }}" --dart-define=PINGPLACE_APP_VERSION="${{ steps.version.outputs.build_name }}" --dart-define=PINGPLACE_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" --dart-define=PINGPLACE_GIT_SHA="${{ steps.version.outputs.commit_short }}" --dart-define=PINGPLACE_BUILD_TYPE=debug

      - name: Verify generated APK versionCode
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-debug.apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "${aapt_path}" ]]; then
            echo "Could not find Android aapt" >&2
            exit 1
          fi

          actual_version_code="$("${aapt_path}" dump badging "${apk_path}" |
            sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [[ -z "${actual_version_code}" ]]; then
            echo "Could not read APK versionCode" >&2
            exit 1
          fi
          if [[ "${actual_version_code}" != "${EXPECTED_VERSION_CODE}" ]]; then
            echo "APK versionCode ${actual_version_code} does not match expected ${EXPECTED_VERSION_CODE}" >&2
            exit 1
          fi
          echo "Verified APK versionCode: ${actual_version_code}"

      - name: Test certificate fingerprint parser
        shell: bash
        run: bash .github/scripts/test-certificate-fingerprint.sh

      - name: Verify APK signing certificate
        env:
          PINGPLACE_DEBUG_STORE_PASSWORD: ${{ secrets.PINGPLACE_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_KEY_ALIAS }}
          PINGPLACE_TRUSTED_CERT_SHA256: ${{ vars.PINGPLACE_TRUSTED_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-debug.apk"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner_path}" ]]; then
            echo "Could not find Android apksigner" >&2
            exit 1
          fi
          bash .github/scripts/verify-apk-signing.sh \
            "${apk_path}" \
            ${RUNNER_TEMP}/pingplace-signing/pingplace-debug.keystore \
            "${apksigner_path}"

      - name: Rename APK with build identity
        run: >-
          cp build/app/outputs/flutter-apk/app-debug.apk
          "build/app/outputs/flutter-apk/pingplace-signed-test-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_short }}-build${{ steps.version.outputs.build_number }}.apk"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: pingplace-signed-test-apk-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_short }}-build${{ steps.version.outputs.build_number }}
          path: build/app/outputs/flutter-apk/pingplace-signed-test-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pingplace-signing"
