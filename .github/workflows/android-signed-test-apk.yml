name: Android signed test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-test-apk:
    name: Build and upload signed test APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # .metadata pins the project to the Flutter 3.47.7 stable revision.
          flutter-version: 3.47.7
          cache: true

      - name: Read trusted build identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "${version_line}" ]]; then
            echo "Could not read the app version from pubspec.yaml" >&2
            exit 1
          fi

          build_name="${version_line%%+*}"
          commit_short="$(git rev-parse --short=7 HEAD)"
          # Keep signed test APK versionCodes increasing across manual runs so
          # a later APK can update an earlier one without uninstalling it.
          build_number="$((10000 + GITHUB_RUN_NUMBER))"

          echo "version=${version_line}" >> "${GITHUB_OUTPUT}"
          echo "build_name=${build_name}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "commit_short=${commit_short}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate signing secrets
        env:
          PINGPLACE_DEBUG_KEYSTORE_BASE64: ${{ secrets.PINGPLACE_DEBUG_KEYSTORE_BASE64 }}
          PINGPLACE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PINGPLACE_DEBUG_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_DEBUG_KEY_ALIAS }}
          PINGPLACE_DEBUG_KEY_PASSWORD: ${{ secrets.PINGPLACE_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PINGPLACE_DEBUG_KEYSTORE_BASE64 \
            PINGPLACE_DEBUG_KEYSTORE_PASSWORD \
            PINGPLACE_DEBUG_KEY_ALIAS \
            PINGPLACE_DEBUG_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure the dedicated test-signing secrets documented in README.md."
            exit 1
          fi

      - name: Reconstruct dedicated test keystore
        env:
          PINGPLACE_DEBUG_KEYSTORE_BASE64: ${{ secrets.PINGPLACE_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          printf '%s' "${PINGPLACE_DEBUG_KEYSTORE_BASE64}" | base64 --decode > .ci-signing/pingplace-debug.keystore
          chmod 600 .ci-signing/pingplace-debug.keystore
          test -s .ci-signing/pingplace-debug.keystore

      - name: Build consistently signed test APK
        env:
          PINGPLACE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PINGPLACE_DEBUG_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_DEBUG_KEY_ALIAS }}
          PINGPLACE_DEBUG_KEY_PASSWORD: ${{ secrets.PINGPLACE_DEBUG_KEY_PASSWORD }}
        run: >-
          ./android/gradlew --no-daemon :app:assembleDebug
          -PpingplaceDebugKeystoreFile="${{ github.workspace }}/.ci-signing/pingplace-debug.keystore"
          -PpingplaceDebugKeystorePassword="${PINGPLACE_DEBUG_KEYSTORE_PASSWORD}"
          -PpingplaceDebugKeyAlias="${PINGPLACE_DEBUG_KEY_ALIAS}"
          -PpingplaceDebugKeyPassword="${PINGPLACE_DEBUG_KEY_PASSWORD}"
          -Pflutter.versionName="${{ steps.version.outputs.build_name }}"
          -Pflutter.versionCode="${{ steps.version.outputs.build_number }}"

      - name: Verify APK signing certificate
        env:
          PINGPLACE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PINGPLACE_DEBUG_KEYSTORE_PASSWORD }}
          PINGPLACE_DEBUG_KEY_ALIAS: ${{ secrets.PINGPLACE_DEBUG_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/apk/debug/app-debug.apk"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner_path}" ]]; then
            echo "Could not find Android apksigner" >&2
            exit 1
          fi

          keystore_fingerprint="$(keytool -list -v \
            -keystore .ci-signing/pingplace-debug.keystore \
            -storepass "${PINGPLACE_DEBUG_KEYSTORE_PASSWORD}" \
            -alias "${PINGPLACE_DEBUG_KEY_ALIAS}" |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apk_fingerprint="$("${apksigner_path}" verify --print-certs "${apk_path}" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
            tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [[ -z "${keystore_fingerprint}" || -z "${apk_fingerprint}" ]]; then
            echo "Could not read the signing certificate fingerprint" >&2
            exit 1
          fi
          if [[ "${keystore_fingerprint}" != "${apk_fingerprint}" ]]; then
            echo "APK certificate does not match the dedicated test keystore" >&2
            exit 1
          fi
          echo "Verified APK certificate SHA-256: ${apk_fingerprint}"

      - name: Rename APK with build identity
        run: >-
          cp build/app/outputs/apk/debug/app-debug.apk
          "build/app/outputs/apk/debug/pingplace-signed-test-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_short }}-build${{ steps.version.outputs.build_number }}.apk"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: pingplace-signed-test-apk-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_short }}-build${{ steps.version.outputs.build_number }}
          path: build/app/outputs/apk/debug/pingplace-signed-test-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -rf .ci-signing
