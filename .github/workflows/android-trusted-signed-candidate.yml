name: Android trusted signed test APK

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number whose exact head is approved
        required: true
        type: string
      source_sha:
        description: Exact PR head SHA
        required: true
        type: string
      source_run_id:
        description: Successful untrusted candidate workflow run ID
        required: true
        type: string
      source_artifact_id:
        description: Exact artifact ID from that workflow run
        required: true
        type: string
      source_artifact_name:
        description: Exact untrusted artifact name
        required: true
        type: string
      source_artifact_sha256:
        description: SHA-256 of candidate/pingplace-candidate.apk
        required: true
        type: string
      expected_package_id:
        description: Expected Android application ID
        required: true
        default: com.example.pingplace
        type: string
      expected_version_name:
        description: Expected Android versionName
        required: true
        default: 1.0.0
        type: string
      expected_commit_sha:
        description: Expected full source commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-approved-candidate:
    name: Verify approved candidate artifact
    runs-on: ubuntu-latest
    outputs:
      baseline_version_code: ${{ steps.baseline_version.outputs.version_code }}
      candidate_version_code: ${{ steps.candidate.outputs.version_code }}
      candidate_sha256: ${{ steps.candidate.outputs.apk_sha256 }}
      candidate_display_build_number: ${{ steps.candidate.outputs.display_build_number }}

    steps:
      - name: Check out trusted verification tests
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require the trusted main definition of this workflow
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Trusted signing must be dispatched from main, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Run provenance regression tests
        run: bash .github/scripts/test-signed-artifact-provenance.sh

      - name: Run signing baseline regression tests
        shell: bash
        run: bash .github/scripts/test-signing-baseline.sh

      - name: Verify signing environment requires approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: pingplace-signed-test-approval
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/provenance"
          mkdir -p "${evidence}"
          gh api "repos/${GITHUB_REPOSITORY}/environments/${EXPECTED_ENVIRONMENT}" > "${evidence}/environment.json"
          if [[ "$(jq -r '.deployment_branch_policy.custom_branch_policies' "${evidence}/environment.json")" == "true" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/environments/${EXPECTED_ENVIRONMENT}/deployment-branch-policies?per_page=100" \
              > "${evidence}/branch-policies.json"
          else
            printf '{"total_count":0,"branch_policies":[]}' > "${evidence}/branch-policies.json"
          fi
          ENVIRONMENT_JSON="${evidence}/environment.json" \
          BRANCH_POLICIES_JSON="${evidence}/branch-policies.json" \
            bash .github/scripts/verify-candidate-provenance.sh signing-environment

      - name: Verify PR state and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_PR}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi
          evidence="${RUNNER_TEMP}/provenance"
          mkdir -p "${evidence}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" > "${evidence}/pr.json"
          PR_JSON="${evidence}/pr.json" bash .github/scripts/verify-candidate-provenance.sh pull-request

      - name: Verify source workflow run provenance through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be numeric"
            exit 1
          fi
          evidence="${RUNNER_TEMP}/provenance"
          mkdir -p "${evidence}"
          candidate_workflow=".github/workflows/android-untrusted-candidate.yml"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "${evidence}/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "${evidence}/artifacts.json"
          # Trusted main is this verifier's own checkout of main.
          trusted_main_sha="$(git rev-parse HEAD)"
          trusted_workflow_blob="$(git rev-parse "HEAD:${candidate_workflow}")"
          run_workflow_blob="not-applicable"
          printf '{}' > "${evidence}/compare.json"
          if [[ "$(jq -r '.event' "${evidence}/run.json")" == "workflow_dispatch" ]]; then
            run_head_sha="$(jq -r '.head_sha' "${evidence}/run.json")"
            if ! [[ "${run_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Dispatch run head '${run_head_sha}' is not a commit SHA"
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/compare/${run_head_sha}...${trusted_main_sha}" \
              --jq '{status, ahead_by, behind_by, merge_base_commit: {sha: .merge_base_commit.sha}}' \
              > "${evidence}/compare.json"
            run_workflow_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${candidate_workflow}?ref=${run_head_sha}" --jq '.sha')"
          fi
          RUN_JSON="${evidence}/run.json" \
          ARTIFACTS_JSON="${evidence}/artifacts.json" \
          COMPARE_JSON="${evidence}/compare.json" \
          RUN_WORKFLOW_BLOB_SHA="${run_workflow_blob}" \
          TRUSTED_WORKFLOW_BLOB_SHA="${trusted_workflow_blob}" \
            bash .github/scripts/verify-candidate-provenance.sh candidate-run

      - name: Download only the verified candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source

      - name: Verify candidate hash and metadata
        id: candidate
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPECTED_FULL_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_ARTIFACT_SHA256: ${{ inputs.source_artifact_sha256 }}
          EXPECTED_PACKAGE_ID: ${{ inputs.expected_package_id }}
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
        run: |
          set -euo pipefail
          apk_path="$(find source -type f -name '*.apk' -print)"
          manifest_path="$(find source -type f -name manifest.json -print)"
          test -n "${apk_path}"
          test -n "${manifest_path}"
          test "$(find source -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find source -type f -name manifest.json | wc -l)" -eq 1
          actual_sha256="$(sha256sum "${apk_path}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_ARTIFACT_SHA256}"
          test "$(jq -r .apk_sha256 "${manifest_path}")" = "${actual_sha256}"
          test "$(jq -r .source_sha "${manifest_path}")" = "${EXPECTED_SHA}"
          test "${EXPECTED_FULL_SHA}" = "${EXPECTED_SHA}"
          test "$(jq -r .embedded_commit_sha "${manifest_path}")" = "${EXPECTED_SHA:0:7}"
          MANIFEST_JSON="${manifest_path}" bash .github/scripts/verify-candidate-provenance.sh manifest
          display_build_number="$(jq -r .display_build_number "${manifest_path}")"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          badging="$("${aapt_path}" dump badging "${apk_path}")"
          test "$(grep -o "package: name='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)" = "${EXPECTED_PACKAGE_ID}"
          test "$(grep -o "versionName='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)" = "${EXPECTED_VERSION_NAME}"
          version_code="$(grep -o "versionCode='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)"
          test "${version_code}" -gt 0
          test "$(jq -r .version_code "${manifest_path}")" = "${version_code}"
          bash .github/scripts/verify-apk-build-identity.sh "${apk_path}" "${EXPECTED_SHA}" "${EXPECTED_PACKAGE_ID}" "${EXPECTED_VERSION_NAME}" "${version_code}"
          echo "apk_sha256=${actual_sha256}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "display_build_number=${display_build_number}" >> "${GITHUB_OUTPUT}"

      # The upgrade baseline (latest issued signed build) is pinned in
      # .github/signing/issued-baseline.env and changed only by reviewed PRs.
      - name: Load pinned issued baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/signing-baseline.sh load .github/signing/issued-baseline.env >> "${GITHUB_OUTPUT}"

      - name: Verify issued baseline run and artifact through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          BASELINE_RUN_WORKFLOW: ${{ steps.baseline.outputs.run_workflow }}
          BASELINE_RUN_HEAD_SHA: ${{ steps.baseline.outputs.run_head_sha }}
          BASELINE_ARTIFACT_ID: ${{ steps.baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_NAME: ${{ steps.baseline.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/baseline"
          mkdir -p "${evidence}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}" > "${evidence}/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}/artifacts?per_page=100" > "${evidence}/artifacts.json"
          RUN_JSON="${evidence}/run.json" ARTIFACTS_JSON="${evidence}/artifacts.json"             bash .github/scripts/signing-baseline.sh verify-run

      - name: Download issued baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify candidate can upgrade the issued baseline in place
        id: baseline_version
        env:
          EXPECTED_PACKAGE_ID: ${{ inputs.expected_package_id }}
          CANDIDATE_VERSION_CODE: ${{ steps.candidate.outputs.version_code }}
          TRUSTED_CERT_SHA256: ${{ vars.PINGPLACE_TRUSTED_CERT_SHA256 }}
          BASELINE_APK_SHA256: ${{ steps.baseline.outputs.apk_sha256 }}
          BASELINE_PACKAGE_ID: ${{ steps.baseline.outputs.package_id }}
          BASELINE_VERSION_NAME: ${{ steps.baseline.outputs.version_name }}
          BASELINE_VERSION_CODE: ${{ steps.baseline.outputs.version_code }}
          BASELINE_SOURCE_SHA: ${{ steps.baseline.outputs.source_sha }}
          BASELINE_BUILD_LABEL: ${{ steps.baseline.outputs.build_label }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_apk="$(find baseline -type f -name '*.apk' -print)"
          test -n "${baseline_apk}"
          test "$(find baseline -type f -name '*.apk' | wc -l)" -eq 1
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${aapt_path}"
          test -n "${apksigner_path}"
          baseline_badging="$("${aapt_path}" dump badging "${baseline_apk}")"
          # The installed build must carry the trusted certificate, otherwise the
          # signed candidate could not be installed over it as an update.
          "${apksigner_path}" verify --print-certs "${baseline_apk}" > baseline-certs.txt
          OBSERVED_APK_SHA256="$(sha256sum "${baseline_apk}" | awk '{print $1}')"           OBSERVED_PACKAGE_ID="$(grep -o "package: name='[^']*'" <<< "${baseline_badging}" | head -n 1 | cut -d"'" -f2)"           OBSERVED_VERSION_NAME="$(grep -o "versionName='[^']*'" <<< "${baseline_badging}" | head -n 1 | cut -d"'" -f2)"           OBSERVED_VERSION_CODE="$(grep -o "versionCode='[^']*'" <<< "${baseline_badging}" | head -n 1 | cut -d"'" -f2)"           OBSERVED_SOURCE_SHA="$(unzip -p "${baseline_apk}" assets/pingplace-build-identity.json | jq -r .source_sha)"           OBSERVED_CERT_SHA256="$(awk '/certificate SHA-256 digest:/ { value=$0; sub(/^.*digest:[[:space:]]*/, "", value); gsub(/[[:space:]:
]/, "", value); if (length(value) == 64) { print tolower(value); exit } }' baseline-certs.txt)"             bash .github/scripts/signing-baseline.sh verify-apk
          echo "version_code=${BASELINE_VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "Issued baseline: ${BASELINE_BUILD_LABEL} (versionCode ${BASELINE_VERSION_CODE})"

      - name: Publish verified candidate for the approved signing job
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate
          path: source
          if-no-files-found: error
          retention-days: 1

  sign-approved-candidate:
    name: Sign approved candidate APK
    needs: verify-approved-candidate
    runs-on: ubuntu-latest
    environment:
      name: pingplace-signed-test-approval
    steps:
      - name: Download verified candidate only
        uses: actions/download-artifact@v4
        with:
          name: verified-candidate
          path: verified

      - name: Reconstruct keystore in runner temp
        env:
          PINGPLACE_KEYSTORE_BASE64: ${{ secrets.PINGPLACE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/pingplace-signing"
          mkdir -p "${signing_dir}"
          printf '%s' "${PINGPLACE_KEYSTORE_BASE64}" | base64 --decode > "${signing_dir}/pingplace-test.keystore"
          chmod 600 "${signing_dir}/pingplace-test.keystore"
          test -s "${signing_dir}/pingplace-test.keystore"

      - name: Sign and verify without project execution
        env:
          PINGPLACE_STORE_PASSWORD: ${{ secrets.PINGPLACE_KEYSTORE_PASSWORD }}
          PINGPLACE_KEY_ALIAS: ${{ secrets.PINGPLACE_KEY_ALIAS }}
          PINGPLACE_KEY_PASSWORD: ${{ secrets.PINGPLACE_KEY_PASSWORD }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_PACKAGE_ID: ${{ inputs.expected_package_id }}
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
          EXPECTED_VERSION_CODE: ${{ needs.verify-approved-candidate.outputs.candidate_version_code }}
          EXPECTED_BASELINE_VERSION_CODE: ${{ needs.verify-approved-candidate.outputs.baseline_version_code }}
          EXPECTED_CANDIDATE_SHA256: ${{ needs.verify-approved-candidate.outputs.candidate_sha256 }}
          TRUSTED_CERT_SHA256: ${{ vars.PINGPLACE_TRUSTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_BASELINE_VERSION_CODE}" || ! "${EXPECTED_BASELINE_VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::Baseline versionCode output is missing or invalid"
            exit 1
          fi
          signing_dir="${RUNNER_TEMP}/pingplace-signing"
          input_apk="$(find verified -type f -name '*.apk' -print)"
          manifest_path="$(find verified -type f -name manifest.json -print)"
          test -n "${input_apk}"
          test -n "${manifest_path}"
          test "$(sha256sum "${input_apk}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          test "$(jq -r .source_sha "${manifest_path}")" = "${EXPECTED_SHA:0:40}"
          test "${EXPECTED_VERSION_CODE}" -gt "${EXPECTED_BASELINE_VERSION_CODE}"
          cp "${input_apk}" "${signing_dir}/unsigned.apk"
          zip -d "${signing_dir}/unsigned.apk" 'META-INF/*' >/dev/null 2>&1 || true
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "${apksigner_path}"
          test -n "${aapt_path}"
          test -n "${TRUSTED_CERT_SHA256}"
          keytool -list -keystore "${signing_dir}/pingplace-test.keystore" -storepass "${PINGPLACE_STORE_PASSWORD}" -alias "${PINGPLACE_KEY_ALIAS}" >/dev/null
          "${apksigner_path}" sign --ks "${signing_dir}/pingplace-test.keystore" --ks-pass env:PINGPLACE_STORE_PASSWORD --ks-key-alias "${PINGPLACE_KEY_ALIAS}" --key-pass env:PINGPLACE_KEY_PASSWORD --out "${signing_dir}/signed.apk" "${signing_dir}/unsigned.apk"
          "${apksigner_path}" verify --verbose --print-certs "${signing_dir}/signed.apk" > "${signing_dir}/apksigner.txt"
          fingerprint="$(awk '/certificate SHA-256 digest:/ { value=$0; sub(/^.*digest:[[:space:]]*/, "", value); gsub(/[[:space:]:\r]/, "", value); if (length(value) == 64) { print tolower(value); exit } }' "${signing_dir}/apksigner.txt")"
          expected_fingerprint="$(printf '%s' "${TRUSTED_CERT_SHA256}" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "${fingerprint}" = "${expected_fingerprint}"
          badging="$("${aapt_path}" dump badging "${signing_dir}/signed.apk")"
          test "$(grep -o "package: name='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)" = "${EXPECTED_PACKAGE_ID}"
          test "$(grep -o "versionName='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)" = "${EXPECTED_VERSION_NAME}"
          test "$(grep -o "versionCode='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)" = "${EXPECTED_VERSION_CODE}"
          identity_json="$(unzip -p "${signing_dir}/signed.apk" assets/pingplace-build-identity.json)"
          test "$(jq -r .source_sha <<< "${identity_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r .embedded_commit_sha <<< "${identity_json}")" = "${EXPECTED_SHA:0:7}"
          test "$(jq -r .package_id <<< "${identity_json}")" = "${EXPECTED_PACKAGE_ID}"
          test "$(jq -r .version_name <<< "${identity_json}")" = "${EXPECTED_VERSION_NAME}"
          test "$(jq -r .version_code <<< "${identity_json}")" = "${EXPECTED_VERSION_CODE}"
          test "${EXPECTED_VERSION_CODE}" -gt "${EXPECTED_BASELINE_VERSION_CODE}"
          echo "Verified certificate SHA-256: ${fingerprint}"
          echo "Verified package=${EXPECTED_PACKAGE_ID} versionName=${EXPECTED_VERSION_NAME} versionCode=${EXPECTED_VERSION_CODE} commit=${EXPECTED_SHA:0:7}"
          mkdir -p signed
          cp "${signing_dir}/signed.apk" "signed/pingplace-signed-test.apk"

      - name: Upload signed test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingplace-signed-test-v${{ inputs.expected_version_name }}+${{ needs.verify-approved-candidate.outputs.candidate_display_build_number }}-build${{ needs.verify-approved-candidate.outputs.candidate_version_code }}-${{ inputs.source_sha }}
          path: signed/pingplace-signed-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/pingplace-signing"
