name: GitHub Actions workflow lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate workflow syntax with actionlint
        uses: raven-actions/actionlint@v2
        with:
          # This check is intentionally scoped to workflow syntax and expressions.
          # Existing shell style is validated by the workflow's own Bash steps.
          shellcheck: false
