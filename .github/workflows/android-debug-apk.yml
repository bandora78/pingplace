name: Android debug APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and upload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # .metadata pins the project to the Flutter 3.47.7 stable revision.
          flutter-version: 3.47.7
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "${version_line}" ]]; then
            echo "Could not read the app version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=${version_line}" >> "${GITHUB_OUTPUT}"

          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Run Android JVM tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1

      - name: Upload Android JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-reports
          path: |
            build/app/test-results/testDebugUnitTest/**/*.xml
            build/app/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pingplace-debug-apk-${{ steps.version.outputs.short_sha }}-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
