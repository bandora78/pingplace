name: Android signing integration tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/android-signed-test-apk.yml'
      - '.github/workflows/android-signing-integration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-real-apk-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build real debug APK for integration test
        run: |
          flutter pub get
          flutter build apk --debug --build-number 10004

      - name: Run real APK signing integration test
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner_path}" ]]; then
            echo "Could not find Android apksigner" >&2
            exit 1
          fi
          bash .github/scripts/test-apk-signing-integration.sh \
            build/app/outputs/flutter-apk/app-debug.apk \
            "${apksigner_path}"
