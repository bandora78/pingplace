name: Android untrusted candidate APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to build without signing secrets
        required: true
        type: string

# For manual dispatches the run head is the dispatching ref (main), not the
# commit being built. GitHub renders run-name from this trusted definition
# before any job starts, so it is the only run metadata that binds the built
# SHA to the run and cannot be changed by the untrusted build code. The trusted
# signing workflow requires this exact format; keep the two in sync.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Untrusted candidate APK for {0}', inputs.target_sha)
  || github.event.pull_request.title }}

permissions:
  contents: read

jobs:
  build-untrusted-candidate:
    name: Build untrusted candidate APK
    runs-on: ubuntu-latest

    steps:
      - name: Require a full commit SHA for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-character commit SHA, not a branch, tag or abbreviation"
            exit 1
          fi

      - name: Check out exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Read source and version identity
        id: identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${REQUESTED_SHA}" ]]; then
            echo "::error::Checked-out commit ${source_sha} is not the requested commit ${REQUESTED_SHA}"
            exit 1
          fi
          short_sha="${source_sha:0:7}"
          version_line="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "${version_line}" || "${version_line}" != *+* ]]; then
            echo "::error::pubspec.yaml does not contain a complete version"
            exit 1
          fi
          build_name="${version_line%%+*}"
          display_build_number="${version_line##*+}"
          if ! [[ "${display_build_number}" =~ ^[0-9]+$ ]]; then
            echo "::error::The Flutter build number is not numeric"
            exit 1
          fi
          version_code="$((10000 + display_build_number))"
          if (( version_code <= 10007 )); then
            echo "::error::Candidate versionCode ${version_code} is not newer than signed Build 12 (10007)"
            exit 1
          fi
          {
            echo "source_sha=${source_sha}"
            echo "short_sha=${short_sha}"
            echo "build_name=${build_name}"
            echo "display_build_number=${display_build_number}"
            echo "version_code=${version_code}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify pull request source identity
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          echo "Verified checked-out source matches pull_request.head.sha"

      - name: Install dependencies
        run: flutter pub get

      - name: Run APK identity regression tests
        shell: bash
        run: bash .github/scripts/test-apk-build-identity.sh

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned-reissuable candidate
        run: |
          flutter build apk --debug \
            --build-name "${{ steps.identity.outputs.build_name }}" \
            --build-number "${{ steps.identity.outputs.version_code }}" \
            --dart-define=PINGPLACE_APP_VERSION="${{ steps.identity.outputs.build_name }}" \
            --dart-define=PINGPLACE_BUILD_NUMBER="${{ steps.identity.outputs.display_build_number }}" \
            --dart-define=PINGPLACE_GIT_SHA="${{ steps.identity.outputs.short_sha }}" \
            --dart-define=PINGPLACE_BUILD_TYPE=debug

      - name: Verify candidate metadata and write manifest
        shell: bash
        env:
          EXPECTED_PACKAGE_ID: com.example.pingplace
          EXPECTED_BUILD_NAME: ${{ steps.identity.outputs.build_name }}
          EXPECTED_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          EXPECTED_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          EXPECTED_SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          DISPLAY_BUILD_NUMBER: ${{ steps.identity.outputs.display_build_number }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-debug.apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [[ -z "${aapt_path}" ]]; then
            echo "::error::Android aapt was not found"
            exit 1
          fi
          badging="$("${aapt_path}" dump badging "${apk_path}")"
          package_id="$(grep -o "package: name='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)"
          version_name="$(grep -o "versionName='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)"
          version_code="$(grep -o "versionCode='[^']*'" <<< "${badging}" | head -n 1 | cut -d"'" -f2)"
          test "${package_id}" = "${EXPECTED_PACKAGE_ID}"
          test "${version_name}" = "${EXPECTED_BUILD_NAME}"
          test "${version_code}" = "${EXPECTED_VERSION_CODE}"
          mkdir -p identity/assets
          cat > identity/assets/pingplace-build-identity.json <<EOF
          {
            "source_sha": "${EXPECTED_SOURCE_SHA}",
            "embedded_commit_sha": "${EXPECTED_SHORT_SHA}",
            "package_id": "${package_id}",
            "version_name": "${version_name}",
            "version_code": ${version_code}
          }
          EOF
          (cd identity && zip -q "${GITHUB_WORKSPACE}/${apk_path}" assets/pingplace-build-identity.json)
          bash .github/scripts/verify-apk-build-identity.sh "${apk_path}" "${EXPECTED_SOURCE_SHA}" "${EXPECTED_PACKAGE_ID}" "${EXPECTED_BUILD_NAME}" "${EXPECTED_VERSION_CODE}"
          mkdir -p candidate
          cp "${apk_path}" "candidate/pingplace-candidate.apk"
          apk_sha256="$(sha256sum "candidate/pingplace-candidate.apk" | awk '{print $1}')"
          cat > candidate/manifest.json <<EOF
          {
            "source_sha": "${EXPECTED_SOURCE_SHA}",
            "embedded_commit_sha": "${EXPECTED_SHORT_SHA}",
            "package_id": "${package_id}",
            "version_name": "${version_name}",
            "display_build_number": "${DISPLAY_BUILD_NUMBER}",
            "version_code": ${version_code},
            "apk_sha256": "${apk_sha256}"
          }
          EOF
          cat candidate/manifest.json
          echo "Candidate APK SHA-256: ${apk_sha256}"

      - name: Upload untrusted candidate
        uses: actions/upload-artifact@v4
        with:
          name: pingplace-untrusted-candidate-${{ steps.identity.outputs.short_sha }}-v${{ steps.identity.outputs.build_name }}+${{ steps.identity.outputs.display_build_number }}
          path: candidate
          if-no-files-found: error
          retention-days: 14
